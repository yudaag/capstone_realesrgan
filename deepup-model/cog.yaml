build:
  gpu: true
  cuda: "11.8"
  python_version: "3.10"
  python_requirements: requirements.txt
  system_packages:
    - "ffmpeg"
    - "git"
    - "wget"
    - "libgl1"
    - "libglib2.0-0"
  run:
    - "git clone --depth 1 https://github.com/XPixelGroup/BasicSR.git /src/BasicSR"
    - "pip install -e /src/BasicSR --no-deps"
    - "git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /src/Real-ESRGAN"
    - "pip install -e /src/Real-ESRGAN --no-deps"
    - "mkdir -p /src/weights"
    - "wget -q -O /src/weights/best_proposed_realesrgan_div2k.pth https://pub-010b39628b9c49d3bc4e2ef028d495fc.r2.dev/best_proposed_realesrgan_div2k.pth"
    - "echo '8e8a1af39cf8aa5e1e21b39ea5dd8b10d147f3edad0e677fe825051dbe262f47  /src/weights/best_proposed_realesrgan_div2k.pth' | sha256sum -c -"
    - "wget -q -O /src/weights/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth"

image: "r8.im/yudaag/realesrgan_upscaling"
predict: "predict.py:Predictor"
