name: Push model to Replicate

on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Download repository
        uses: actions/checkout@v4

      - name: Install and login to Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Build and push model
        working-directory: deepup-model
        # GitHub's hosted runner has no NVIDIA GPU. Recent Cog releases try to
        # launch the GPU image while validating the schema after the build,
        # which fails before the already-built image can be published.
        # x-fast uses Cog's static schema and skips that local GPU validation;
        # Replicate still runs the published model on its configured GPU.
        run: cog push --x-fast r8.im/yudaag/realesrgan_upscaling
