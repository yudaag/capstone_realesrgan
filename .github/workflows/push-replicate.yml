name: Push model to Replicate


on:
  workflow_dispatch:


jobs:
  push-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180


    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false


      - name: Download repository
        uses: actions/checkout@v4


      - name: Install and login to Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}


      - name: Build and push model
        working-directory: deepup-model
        run: cog push --x-fast r8.im/yudaag/realesrgan_upscaling

