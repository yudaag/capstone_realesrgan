name: Push model to Replicate

on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Download repository
        uses: actions/checkout@v4

      - name: Install and login to Cog
        uses: replicate/setup-cog@v2
        with:
          # v0.22.0 can produce a manifest rejected by the current Replicate
          # registry after every layer has already been uploaded.
          cog-version: "v0.23.1"
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Build and push model
        working-directory: deepup-model
        # Cog generates the schema statically, so a hosted runner can
        # build and publish this GPU model without launching it locally.
        run: cog push r8.im/yudaag/realesrgan_upscaling
