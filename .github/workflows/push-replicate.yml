name: Push model to Replicate

on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Cog
        run: |
          sudo curl -fsSL -o /usr/local/bin/cog \
            https://github.com/replicate/cog/releases/download/v0.23.1/cog_$(uname -s)_$(uname -m)
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Login to Cog
        env:
          REPLICATE_CLI_AUTH_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: echo "$REPLICATE_CLI_AUTH_TOKEN" | cog login --token-stdin

      - name: Build and push model
        working-directory: deepup-model
        run: cog push r8.im/yudaag/realesrgan_upscaling
